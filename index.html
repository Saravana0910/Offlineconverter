<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Privacy Image Converter (WASM)</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family: system-ui, sans-serif;
  background: #020617;
  color: white;
  margin: 0;
}
.container {
  max-width: 900px;
  margin: auto;
  padding: 20px;
}
h1 { text-align: center; }
input, select, button {
  width: 100%;
  padding: 12px;
  margin-top: 12px;
  border-radius: 8px;
  border: none;
  font-size: 16px;
}
button {
  background: #2563eb;
  color: white;
  cursor: pointer;
}
button:disabled {
  background: #334155;
}
img {
  max-width: 100%;
  margin-top: 15px;
  border-radius: 10px;
}
.log {
  margin-top: 12px;
  color: #22c55e;
  font-size: 14px;
}
.footer {
  margin-top: 20px;
  font-size: 12px;
  color: #94a3b8;
  text-align: center;
}
</style>
</head>

<body>
<div class="container">

<h1>🧠 Privacy Image Converter</h1>
<p style="text-align:center">Runs fully in your browser · No uploads · No tracking</p>

<input type="file" id="fileInput">

<select id="format" disabled>
  <option>Loading engine…</option>
</select>

<button id="convertBtn" disabled>Convert & Download</button>

<img id="preview" hidden>
<div class="log" id="log">Initializing engine…</div>

<div class="footer">
Powered by ImageMagick WebAssembly · Works offline after first load
</div>

</div>

<script type="module">
import {
  initializeImageMagick,
  Magick,
  MagickFormat
} from "https://esm.sh/@imagemagick/magick-wasm@0.0.30";

const log = document.getElementById("log");
const fileInput = document.getElementById("fileInput");
const convertBtn = document.getElementById("convertBtn");
const formatSelect = document.getElementById("format");
const preview = document.getElementById("preview");

let file;

/* ---------- Boot engine ---------- */
async function boot() {
  try {
    log.innerText = "Downloading image engine (first load only)…";
    await initializeImageMagick();
    log.innerText = "Engine ready ✔ Select an image.";

    const formats = ["PNG","JPG","WEBP","AVIF","HEIC","TIFF","BMP","ICO","GIF","PDF","SVG"];

    formatSelect.innerHTML = "";
    formats.forEach(f => {
      const opt = document.createElement("option");
      opt.value = f;
      opt.textContent = f;
      formatSelect.appendChild(opt);
    });

    formatSelect.disabled = false;
    convertBtn.disabled = false;

  } catch (e) {
    console.error(e);
    log.innerText = "❌ Failed to load engine. Try Chrome/Edge/Firefox.";
  }
}
boot();

/* ---------- Image select ---------- */
fileInput.addEventListener("change", e => {
  file = e.target.files[0];
  if (!file) return;

  preview.src = URL.createObjectURL(file);
  preview.hidden = false;
  log.innerText = "Loaded: " + file.name;
});

/* ---------- Convert ---------- */
convertBtn.addEventListener("click", async () => {
  if (!file) return alert("Select an image first");

  try {
    log.innerText = "Processing…";

    const inputBytes = new Uint8Array(await file.arrayBuffer());
    const image = await Magick.Read(inputBytes);

    const format = formatSelect.value;
    image.format = MagickFormat[format];

    const output = await image.write();

    const blob = new Blob([output.buffer]);
    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = "converted." + format.toLowerCase();
    a.click();

    URL.revokeObjectURL(url);
    log.innerText = "Done ✔ Download started";

  } catch (err) {
    console.error(err);
    log.innerText = "❌ Conversion failed (format not supported on this browser)";
  }
});
</script>
</body>
</html>
