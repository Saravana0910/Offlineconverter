<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>WASM Image Converter</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family: system-ui, sans-serif;
  background: #0f172a;
  color: white;
  margin: 0;
}
.container {
  max-width: 900px;
  margin: 40px auto;
  background: #020617;
  padding: 25px;
  border-radius: 14px;
  box-shadow: 0 0 25px rgba(0,0,0,0.6);
}
h1 { text-align:center; }
input, select, button {
  width:100%;
  padding:12px;
  margin-top:12px;
  border-radius:8px;
  border:none;
  font-size:16px;
}
button {
  background:#2563eb;
  color:white;
}
.log {
  margin-top:12px;
  color:#22c55e;
  font-size:14px;
}
img {
  max-width:100%;
  margin-top:15px;
  border-radius:10px;
}
</style>
</head>

<body>

<div class="container">
<h1>🧠 WASM Image Converter</h1>
<p>All processing runs locally in your browser</p>

<input type="file" id="fileInput">

<select id="format">
  <option value="png">PNG</option>
  <option value="jpg">JPG</option>
  <option value="webp">WEBP</option>
  <option value="avif">AVIF</option>
  <option value="heic">HEIC</option>
  <option value="tiff">TIFF</option>
  <option value="bmp">BMP</option>
  <option value="ico">ICO</option>
</select>

<button id="convertBtn">Convert & Download</button>

<div class="log" id="log">Initializing engine…</div>
<img id="preview" hidden>
</div>

<script type="module">
import {
  initializeImageMagick,
  Magick,
  MagickFormat
} from "https://unpkg.com/@imagemagick/magick-wasm@0.0.30/dist/index.min.js";

const log = document.getElementById("log");
const fileInput = document.getElementById("fileInput");
const convertBtn = document.getElementById("convertBtn");
const formatSelect = document.getElementById("format");
const preview = document.getElementById("preview");

let file;

/* ---------- Load engine safely ---------- */
async function boot() {
  try {
    log.innerText = "Loading ImageMagick engine… (first time may take a few seconds)";
    await initializeImageMagick();
    log.innerText = "Engine ready ✔ Select an image.";
  } catch (e) {
    console.error(e);
    log.innerText = "❌ Engine failed to load. Check internet or browser support.";
  }
}
boot();

/* ---------- Load image ---------- */
fileInput.addEventListener("change", e => {
  file = e.target.files[0];
  if (!file) return;

  preview.src = URL.createObjectURL(file);
  preview.hidden = false;
  log.innerText = "Image loaded: " + file.name;
});

/* ---------- Convert ---------- */
convertBtn.addEventListener("click", async () => {
  if (!file) return alert("Select an image first.");

  try {
    log.innerText = "Processing…";

    const inputBytes = new Uint8Array(await file.arrayBuffer());
    const image = await Magick.Read(inputBytes);

    const format = formatSelect.value.toUpperCase();
    image.format = MagickFormat[format];

    const outputBytes = await image.write();

    const blob = new Blob([outputBytes.buffer]);
    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = "converted." + format.toLowerCase();
    a.click();

    URL.revokeObjectURL(url);
    log.innerText = "Done ✔ Download started";

  } catch (err) {
    console.error(err);
    log.innerText = "❌ Conversion failed. Format may not be supported.";
  }
});
</script>

</body>
</html>
