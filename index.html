<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Privacy Image Converter</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family: system-ui, sans-serif;
  background: #020617;
  color: white;
  margin: 0;
}
.container {
  max-width: 900px;
  margin: auto;
  padding: 20px;
}
h1 { text-align: center; }

input, select, button {
  width: 100%;
  padding: 12px;
  margin-top: 12px;
  border-radius: 8px;
  border: none;
  font-size: 16px;
}

button { background: #2563eb; color: white; cursor: pointer; }
button:disabled { background: #334155; cursor: not-allowed; }

img {
  max-width: 100%;
  margin-top: 15px;
  border-radius: 10px;
}

.status {
  margin-top: 12px;
  padding: 10px;
  border-radius: 8px;
  font-size: 14px;
}
.status.info {
  background: #020617;
  color: #22c55e;
  border: 1px solid #14532d;
}
.status.error {
  background: #450a0a;
  color: #fecaca;
  border: 1px solid #7f1d1d;
}
.footer {
  margin-top: 18px;
  font-size: 12px;
  color: #94a3b8;
  text-align: center;
}
</style>
</head>

<body>
<div class="container">

<h1>🧠 Privacy Image Converter</h1>
<p style="text-align:center">All processing happens locally in your browser</p>

<input type="file" id="fileInput">

<select id="format" disabled></select>
<button id="convertBtn" disabled>Convert & Download</button>

<img id="preview" hidden>
<div id="statusBox" class="status info">Initializing engine…</div>

<div class="footer">
Self-hosted WebAssembly · No uploads · No tracking
</div>

</div>

<script type="module">
import {
  initializeImageMagick,
  Magick,
  MagickFormat
} from "./wasm/index.js";

const statusBox = document.getElementById("statusBox");
const fileInput = document.getElementById("fileInput");
const convertBtn = document.getElementById("convertBtn");
const formatSelect = document.getElementById("format");
const preview = document.getElementById("preview");

let file;

function setInfo(msg) {
  statusBox.className = "status info";
  statusBox.innerText = msg;
}
function setError(msg) {
  statusBox.className = "status error";
  statusBox.innerText = msg;
}

/* ---------- Boot engine ---------- */
async function boot() {
  try {
    setInfo("Loading local image engine (first time may take a few seconds)…");

    await initializeImageMagick({
      locateFile: file => "./wasm/" + file
    });

    const formats = [
      "PNG","JPG","WEBP","AVIF",
      "HEIC","TIFF","BMP","ICO",
      "GIF","PDF","SVG"
    ];

    formatSelect.innerHTML = "";
    formats.forEach(f => {
      const opt = document.createElement("option");
      opt.value = f;
      opt.textContent = f;
      formatSelect.appendChild(opt);
    });

    formatSelect.disabled = false;
    convertBtn.disabled = false;

    setInfo("Engine loaded ✔ Select an image.");

  } catch (e) {
    console.error("ENGINE LOAD ERROR:", e);
    setError("❌ Failed to load image engine.\n\n" + (e.message || e));
  }
}

boot();

/* ---------- Image select ---------- */
fileInput.addEventListener("change", e => {
  file = e.target.files[0];
  if (!file) return;

  preview.src = URL.createObjectURL(file);
  preview.hidden = false;
  setInfo("Loaded: " + file.name);
});

/* ---------- Convert ---------- */
convertBtn.addEventListener("click", async () => {
  if (!file) return setError("Select an image first");

  try {
    setInfo("Processing image…");

    const inputBytes = new Uint8Array(await file.arrayBuffer());
    const image = await Magick.Read(inputBytes);

    const fmt = formatSelect.value;
    image.format = MagickFormat[fmt];

    const output = await image.write();

    const blob = new Blob([output.buffer]);
    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = "converted." + fmt.toLowerCase();
    a.click();

    URL.revokeObjectURL(url);
    setInfo("Conversion complete ✔ Download started.");

  } catch (err) {
    console.error("CONVERT ERROR:", err);
    setError("❌ Conversion failed.\n\n" + err.message);
  }
});
</script>

</body>
</html>
